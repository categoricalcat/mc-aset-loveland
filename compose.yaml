name: asetland

services:
  tunnel:
    image: ghcr.io/playit-cloud/playit-agent:latest
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - mc-egress # outbound to playit relays
      - mc-network # reach bias at 172.20.0.6
    restart: 'no'

  server:
    profiles:
      - server
    cpu_shares: 4096
    restart: 'no'
    stdin_open: true
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${TARGETARCH:-linux}
        MEMORY_ALLOCATION: ${MEMORY_ALLOCATION:-16G}
        MODPACK_ARCHIVE: ${MODPACK_ARCHIVE:-the-modpack-1.1.0.mrpack}
    container_name: asetland-server
    ports:
      - '25565:25565/tcp'
      - '25565:25565/udp'
    volumes:
      - mc-data:/opt/minecraft/mc
      - ./server.properties:/opt/minecraft/mc/server.properties
    env_file:
      - .env
    healthcheck:
      test:
        ['CMD', 'mc-monitor', 'status', '-host', '0.0.0.0', '-port', '25565']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backup:
    build:
      context: .
      dockerfile: backup.dockerfile
      args:
        OPERATION: write
    environment:
      - OPERATION=write
    profiles:
      - backup
    volumes:
      - mc-bias:/data:ro # same named volume, read-only
      - ./.backups:/backup # host folder that rclone will read from
      - ./scripts/backup.sh:/script/backup.sh:ro
    restart: 'no'

  restore:
    build:
      context: .
      dockerfile: backup.dockerfile
      args:
        OPERATION: read
    environment:
      - OPERATION=read
    profiles:
      - restore
    volumes:
      - mc-bias:/data # restore target
      - ./.backups:/backup:ro # host backups folder, read-only
      - ./scripts/backup.sh:/script/backup.sh:ro
    restart: 'no'

  serverpack:
    profiles:
      - serverpack
    tty: true
    stdin_open: true
    build:
      context: .
      dockerfile: serverpack.Dockerfile
    container_name: asetland-serverpack
    ports:
      - '25566:25566/tcp'
      - '25566:25566/udp'
    volumes:
      - mc-serverpack:/data
      - ./eula.txt:/data/eula.txt
      - ./server.properties:/data/server.properties
      - ./server-icon.png:/data/server-icon.png
      - ./user_jvm_args.txt:/data/user_jvm_args.txt
      - ./scripts/start-server.sh:/data/start-server.sh
      - ./server-1.16.5.jar:/data/server-1.16.5.jar
    restart: 'no'

  bias:
    image: itzg/minecraft-server:latest
    # no published ports: public access via playit tunnel only (tunnel->bias over mc-network)
    tty: true
    stdin_open: true
    mem_limit: 14g
    environment:
      EULA: 'TRUE'
      # Loader+mods pre-installed in the mc-bias volume; pinned NEOFORGE_VERSION
      # keeps init offline (no modrinth contact on boot).
      TYPE: 'NEOFORGE'
      VERSION: '1.21.11'
      NEOFORGE_VERSION: '21.11.38-beta'
      INIT_MEMORY: '3G'
      MAX_MEMORY: '12G'
      SKIP_SERVER_PROPERTIES: 'TRUE'
      SERVER_PORT: '25564'
    volumes:
      - 'mc-bias:/data'
      - ./server.properties:/data/server.properties:ro
      - ./server-icon.png:/data/server-icon.png:ro
      - ./bias-processed.mrpack:/data/modpacks/bias-processed.mrpack:ro
    env_file:
      - .env
    depends_on:
      - tunnel
    networks:
      mc-egress: # outbound (mods, Mojang auth); no inbound except via tunnel/LAN binds
      mc-network:
        ipv4_address: 172.20.0.6 # Use this for your bias server tunnel

volumes:
  mc-data:
    name: mc-data
  mc-serverpack:
    name: mc-serverpack
  mc-bias:
    name: mc-bias

networks:
  mc-egress: # NAT'd outbound; only for services that need the internet
  mc-network:
    internal: true # no gateway/NAT: private tunnel<->bias leg; bias egress rides mc-egress
    ipam:
      config:
        - subnet: 172.20.0.0/16
