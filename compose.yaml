name: asetland

# Every image comes from Nix (`nix run .#load-images`); compose never builds or pulls.
# bias, server, and serverpack share asetland-server. `nix run .#install-pack`
# writes the tree mounted at /opt/pack; the entrypoint only links it and starts Java.
x-pack-server: &pack-server
  image: asetland-server
  pull_policy: never
  stdin_open: true
  tty: true
  restart: 'no'
  # Image runs as uid 65532 (nix/images.nix User), so it needs no capabilities.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  env_file:
    - .env
  environment:
    MEMORY_ALLOCATION: ${MEMORY_ALLOCATION:-8G}
  healthcheck:
    test:
      ['CMD', 'mc-monitor', 'status', '-host', '127.0.0.1', '-port', '25564']
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 5s

x-backup-worker: &backup-worker
  image: asetland-backup
  pull_policy: never
  restart: 'no'
  # Runs as root; per-service cap_add restores only the file caps each op needs.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  tunnel:
    image: ghcr.io/playit-cloud/playit-agent:latest # pinned digest from nix/images.nix
    pull_policy: never
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - mc-egress # outbound to playit relays
      - mc-network # reach bias at 172.20.0.6
    # Stateless outbound agent (config comes from SECRET_KEY): no writes.
    # If the agent ever fails to start, drop read_only first.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN # playitd >=2.0 chowns /run/playit/playitd.sock to its group
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  server:
    <<: *pack-server
    profiles:
      - server
    cpu_shares: 4096
    container_name: asetland-server
    ports:
      - '127.0.0.1:25565:25564/tcp'
      - '127.0.0.1:25565:25564/udp'
    volumes:
      - mc-data:/data
      - ./eula.txt:/data/eula.txt:ro
      - ./server.properties:/data/server.properties:ro
      - ./server-icon.png:/data/server-icon.png:ro
      - ./.packs/server:/opt/pack:ro

  backup:
    <<: *backup-worker
    environment:
      - OPERATION=write
      - BACKUP_VOLUME=${BACKUP_VOLUME:-asetland}
    profiles:
      - backup
    # read uid-1000 world files (/data is ro) + write a user-owned .backups on rootful docker
    cap_add:
      - DAC_OVERRIDE
    volumes:
      - ${BACKUP_VOLUME:-asetland}:/data:ro # target volume, read-only
      - ./.backups:/backup # host folder that rclone will read from
      - ./scripts/backup.sh:/script/backup.sh:ro

  restore:
    <<: *backup-worker
    environment:
      - OPERATION=read
      - BACKUP_VOLUME=${BACKUP_VOLUME:-asetland}
    profiles:
      - restore
    cap_add: # wipe + extract with original ownership
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - ${BACKUP_VOLUME:-asetland}:/data # restore target
      - ./.backups:/backup:ro # host backups folder, read-only
      - ./scripts/backup.sh:/script/backup.sh:ro

  restic:
    <<: *backup-worker
    profiles:
      - restic
    env_file:
      - .env
    environment:
      - OPERATION=restic
      - BACKUP_VOLUME=${BACKUP_VOLUME:-asetland}
    cap_add:
      - DAC_OVERRIDE
    volumes:
      - ${BACKUP_VOLUME:-asetland}:/data:ro
      - ./.backups/restic:/repo
      - ./scripts/backup.sh:/script/backup.sh:ro

  serverpack:
    <<: *pack-server
    profiles:
      - serverpack
    container_name: asetland-serverpack
    ports:
      - '127.0.0.1:25566:25564/tcp'
      - '127.0.0.1:25566:25564/udp'
    volumes:
      - mc-serverpack:/data
      - ./eula.txt:/data/eula.txt:ro
      - ./server.properties:/data/server.properties:ro
      - ./server-icon.png:/data/server-icon.png:ro
      - ./.packs/serverpack:/opt/pack:ro

  bias:
    image: asetland-server
    pull_policy: never
    # no published ports: public access via playit tunnel only (tunnel->bias over mc-network)
    tty: true
    stdin_open: true
    # 8G heap + ~2G JVM overhead; 12G swapped on this 19GB host
    mem_limit: 10g
    # `stop` on SIGTERM, then wait for the world to flush
    stop_grace_period: 1m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # World volume is already uid 1000, so no capabilities are needed.
    user: '1000:1000'
    cap_drop:
      - ALL
    environment:
      MEMORY_ALLOCATION: '8G'
    volumes:
      - asetland:/data
      - ./eula.txt:/data/eula.txt:ro
      - ./server.properties:/data/server.properties:ro
      - ./server-icon.png:/data/server-icon.png:ro
      - ./c2me.toml:/opt/host/c2me.toml:ro
      - ./.packs/bias:/opt/pack:ro
    env_file:
      - .env
    depends_on:
      - tunnel
    networks:
      mc-egress: # outbound (Mojang auth); no inbound except via tunnel/LAN binds
      mc-network:
        ipv4_address: 172.20.0.6 # Use this for your bias server tunnel

volumes:
  mc-data:
    name: mc-data
  mc-serverpack:
    name: mc-serverpack
  # backup workers address volumes by this key (BACKUP_VOLUME default)
  asetland:
    name: ${WORLD_VOLUME:-asetland}

networks:
  mc-egress: # NAT'd outbound; only for services that need the internet
  mc-network:
    internal: true # no gateway/NAT: private tunnel<->bias leg; bias egress rides mc-egress
    ipam:
      config:
        - subnet: 172.20.0.0/16
