name: asetland

# Pack servers share one Dockerfile; versions (MC, loader, Java) come from PACK.
x-pack-server: &pack-server
  stdin_open: true
  tty: true
  restart: 'no'
  env_file:
    - .env
  environment:
    MEMORY_ALLOCATION: ${MEMORY_ALLOCATION:-8G}
  healthcheck:
    test:
      ['CMD', 'mc-monitor', 'status', '-host', '127.0.0.1', '-port', '25564']
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 5s

x-backup-worker: &backup-worker
  image: asetland-backup
  build:
    context: .
    dockerfile: backup.dockerfile
  restart: 'no'

services:
  tunnel:
    image: ghcr.io/playit-cloud/playit-agent:latest
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - mc-egress # outbound to playit relays
      - mc-network # reach bias at 172.20.0.6
    restart: 'no'

  server:
    <<: *pack-server
    profiles:
      - server
    cpu_shares: 4096
    build:
      context: .
      args:
        PACK: ${MODPACK_ARCHIVE:-the-modpack.mrpack}
    container_name: asetland-server
    ports:
      - '25565:25564/tcp'
      - '25565:25564/udp'
    volumes:
      - mc-data:/data
      - ./eula.txt:/data/eula.txt:ro
      - ./server.properties:/data/server.properties:ro
      - ./server-icon.png:/data/server-icon.png:ro

  backup:
    <<: *backup-worker
    environment:
      - OPERATION=write
      - BACKUP_VOLUME=${BACKUP_VOLUME:-mc-bias}
    profiles:
      - backup
    volumes:
      - ${BACKUP_VOLUME:-mc-bias}:/data:ro # target volume, read-only
      - ./.backups:/backup # host folder that rclone will read from
      - ./scripts/backup.sh:/script/backup.sh:ro

  restore:
    <<: *backup-worker
    environment:
      - OPERATION=read
      - BACKUP_VOLUME=${BACKUP_VOLUME:-mc-bias}
    profiles:
      - restore
    volumes:
      - ${BACKUP_VOLUME:-mc-bias}:/data # restore target
      - ./.backups:/backup:ro # host backups folder, read-only
      - ./scripts/backup.sh:/script/backup.sh:ro

  restic:
    <<: *backup-worker
    profiles:
      - restic
    env_file:
      - .env
    environment:
      - OPERATION=restic
      - BACKUP_VOLUME=${BACKUP_VOLUME:-mc-bias}
    volumes:
      - ${BACKUP_VOLUME:-mc-bias}:/data:ro
      - ./.backups/restic:/repo
      - ./scripts/backup.sh:/script/backup.sh:ro

  serverpack:
    <<: *pack-server
    profiles:
      - serverpack
    build:
      context: .
      args:
        PACK: ServerPack.zip
    container_name: asetland-serverpack
    ports:
      - '25566:25564/tcp'
      - '25566:25564/udp'
    volumes:
      - mc-serverpack:/data
      - ./eula.txt:/data/eula.txt:ro
      - ./server.properties:/data/server.properties:ro
      - ./server-icon.png:/data/server-icon.png:ro

  bias:
    image: itzg/minecraft-server:latest
    # no published ports: public access via playit tunnel only (tunnel->bias over mc-network)
    tty: true
    stdin_open: true
    # 8G heap + ~2G JVM overhead; 12G swapped on this 19GB host
    mem_limit: 10g
    environment:
      EULA: 'TRUE'
      # MC + loader versions come from the mrpack; re-applied when it changes.
      TYPE: 'MODRINTH'
      MODRINTH_MODPACK: '/data/modpacks/bias-processed.mrpack'
      MEMORY: '8G'
      USE_AIKAR_FLAGS: 'true'
      JVM_XX_OPTS: '-XX:+UseTransparentHugePages'
      SKIP_SERVER_PROPERTIES: 'TRUE'
      SERVER_PORT: '25564'
    volumes:
      - 'mc-bias:/data'
      - ./server.properties:/data/server.properties:ro
      - ./server-icon.png:/data/server-icon.png:ro
      - ./bias-processed.mrpack:/data/modpacks/bias-processed.mrpack:ro
    env_file:
      - .env
    depends_on:
      - tunnel
    networks:
      mc-egress: # outbound (mods, Mojang auth); no inbound except via tunnel/LAN binds
      mc-network:
        ipv4_address: 172.20.0.6 # Use this for your bias server tunnel

volumes:
  mc-data:
    name: mc-data
  mc-serverpack:
    name: mc-serverpack
  mc-bias:
    name: mc-bias

networks:
  mc-egress: # NAT'd outbound; only for services that need the internet
  mc-network:
    internal: true # no gateway/NAT: private tunnel<->bias leg; bias egress rides mc-egress
    ipam:
      config:
        - subnet: 172.20.0.0/16
